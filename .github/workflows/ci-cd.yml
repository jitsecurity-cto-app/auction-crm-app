name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: crm-app-bucket

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Checkout design system
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/design-system
          path: design-system

      - name: Link design system
        run: |
          ln -s $GITHUB_WORKSPACE/design-system ../design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Link design system node_modules
        run: ln -s $GITHUB_WORKSPACE/node_modules $GITHUB_WORKSPACE/design-system/node_modules

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --testPathIgnorePatterns=e2e

  # Note: Actual deployment is handled by the Deploy workflow (deploy.yml)
  # which uses Terraform for infrastructure + S3/CloudFront deployment.

