name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  S3_BUCKET: crm-app-bucket

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Checkout design system
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/design-system
          path: design-system

      - name: Link design system
        run: |
          ln -s $GITHUB_WORKSPACE/design-system ../design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Link design system node_modules
        run: ln -s $GITHUB_WORKSPACE/node_modules $GITHUB_WORKSPACE/design-system/node_modules

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Checkout design system
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/design-system
          path: design-system

      - name: Link design system
        run: |
          ln -s $GITHUB_WORKSPACE/design-system ../design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Link design system node_modules
        run: ln -s $GITHUB_WORKSPACE/node_modules $GITHUB_WORKSPACE/design-system/node_modules

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::497919588760:role/deployer_oidc
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://${{ env.S3_BUCKET }} --delete
      
      - name: Invalidate CloudFront cache
        run: |
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "CloudFront invalidation would run here"

